# Builds the Broodling image and pulls the adopted target environment image by the digest its adoption
# record (src/Broodling/environments/dotnet-r6.adoption.json) names, checks that image against its retained manifest,
# demonstrates the two together in a disposable ADR 0002 stack, checks that the target image serves
# native state it wrote itself across a restart and state written by each published target image listed
# in deployment/native-state-transitions.json (all with the binding's native release), then publishes
# exactly that Broodling image to GHCR with a release record naming the adopted target. A push publishes
# an immutable sha-<commit> candidate; a v* tag publishes that version, only with a frozen application
# schema. Neither publishes unless the execution asset approval's approval.decision is a public comment URL
# on faviann/broodling. Until then the run fails after its checks and publishes nothing. Fork pull requests
# only build and check; same-repository pull requests are covered by the push run of their head.
name: Images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  images:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # Runs for one publication tag never overlap, so only one can pass the existence check.
    concurrency:
      group: images-${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.event.pull_request.head.sha || github.sha) }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The host runs the image's own check-target, as an operator with Docker access would, and the
      # transition check from the test suite.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Restoring Zeroshot.Client from GitHub Packages needs a package-read credential, even for a public
      # package: this job's token, given to the build only as a secret.
      - name: Pull the adopted target image and build the Broodling image
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }}
        run: |
          target="$(jq -r .image src/Broodling/environments/dotnet-r6.adoption.json)"
          [[ $target =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::The adoption record names no image digest."; exit 1; }
          docker pull --quiet "$target"
          echo "TARGET_IMAGE=$target" >>"$GITHUB_ENV"
          docker build --file deployment/Broodling.Dockerfile --build-arg "REVISION=$REVISION" \
            --secret id=nuget-github,env=NuGetPackageSourceCredentials_github --tag broodling:candidate .

      - name: Demonstrate the images in ADR 0001's topology
        run: tests/images/demonstrate.sh broodling:candidate "$TARGET_IMAGE" "$RUNNER_TEMP/facts.json"

      # A version publishes only an application schema frozen in deployment/application-schemas.json,
      # identified by the image's own initialize-store output; branch candidates may carry an unfrozen one.
      # Checked against the records attached to earlier v* releases: the list must keep every released
      # identity, and a released version's definition never changes.
      - name: Require a frozen application schema for a version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          released="$RUNNER_TEMP/released"
          mkdir -p "$released"
          # Any failure to list or download a record refuses publication.
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
          count=0
          for tag in $tags; do
            [[ $tag == v* && $tag != "$GITHUB_REF_NAME" ]] || continue
            count=$((count + 1))
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release-record.json --output "$released/$count.json"
          done
          shopt -s nullglob
          records=("$released"/*.json)
          jq -n '[inputs | .application]' "${records[@]}" </dev/null >"$RUNNER_TEMP/released.json"
          problems="$(jq -r -n --slurpfile facts "$RUNNER_TEMP/facts.json" --slurpfile list deployment/application-schemas.json \
            --slurpfile released "$RUNNER_TEMP/released.json" '
            def identity: {storeFormat, storeSchemaVersion, storeDefinitionSha256};
            ($facts[0] | identity) as $image | $list[0] as $list | ($released[0] | map(identity)) as $released
            | ($list.frozen | map({storeFormat: $list.format, storeSchemaVersion: .schemaVersion,
                storeDefinitionSha256: .definitionSha256})) as $frozen
            | (if ($frozen | map(.storeSchemaVersion) | length) != ($frozen | map(.storeSchemaVersion) | unique | length)
                then "deployment/application-schemas.json freezes a schema version more than once" else empty end),
              (if any($frozen[]; . == $image) then empty
                else "the image schema \($image | tojson) is not frozen in deployment/application-schemas.json" end),
              ($released[] | select(.storeFormat == $image.storeFormat and .storeSchemaVersion == $image.storeSchemaVersion
                and .storeDefinitionSha256 != $image.storeDefinitionSha256)
                | "a released version has schema version \(.storeSchemaVersion) with definition \(.storeDefinitionSha256)"),
              ($released[] | select(. as $identity | any($frozen[]; . == $identity) | not)
                | "the released schema \(tojson) is missing from deployment/application-schemas.json")')"
          if [[ -n $problems ]]; then
            while IFS= read -r problem; do echo "::error::$problem; nothing was published."; done <<<"$problems"
            exit 1
          fi

      # The release record states these transitions only for the adopted target image checked here, which
      # must also carry what its retained manifest states. The frozen application schemas are checked against
      # this revision's code on every push.
      - name: Check the adopted image, native-state restart and transitions from the listed published target images, and the frozen schemas
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }}
        run: |
          # The runner configures Git LFS filters, a checkout transformation Broodling refuses in custody.
          sudo git config --system --remove-section filter.lfs || :
          git config --global --remove-section filter.lfs || :
          dotnet test --project tests/Broodling.Tests/Broodling.Tests.csproj --treenode-filter '/*/*/(TargetEnvironmentTests)|(TargetImageTransitionTests)|(ApplicationSchemaFreezeTests)/*'

      # The published image bundles approval.json, so only a decided approval publishes. The release record copies
      # only its asset hash and its native and Claude blocks.
      - name: Require a decided execution asset approval
        run: |
          jq -e '.approval.decision | test("^https://github\\.com/faviann/broodling/(issues|pull)/[0-9]+#issuecomment-[0-9]+$")' \
            src/Broodling/execution-assets/approval.json >/dev/null \
            || { echo "::error::approval.json's approval.decision is not a comment URL on faviann/broodling; nothing was published."; exit 1; }

      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          if [[ $GITHUB_REF_TYPE == tag ]]; then tag=$GITHUB_REF_NAME version=$GITHUB_REF_NAME; else tag=sha-$REVISION version=; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Published tags are never moved: select the image by the recorded digest.
          # Only the registry's own not-found means absent; anything else is not a basis to push.
          if found="$(docker buildx imagetools inspect "$registry/broodling:$tag" 2>&1)"; then
            echo "::error::$registry/broodling:$tag is already published; it is never replaced." && exit 1
          elif [[ $found != *"$registry/broodling:$tag: not found"* ]]; then
            echo "::error::Cannot establish that $registry/broodling:$tag is unpublished: $found" && exit 1
          fi
          docker tag broodling:candidate "$registry/broodling:$tag"
          docker push --quiet "$registry/broodling:$tag"
          # The digest this push produced, not whatever the tag names by now.
          broodling="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' broodling:candidate \
            | grep --max-count 1 "^$registry/broodling@sha256:")"
          jq -n --arg revision "$REVISION" --arg version "$version" --arg tag "$tag" \
            --arg broodling "$broodling" --arg target "$TARGET_IMAGE" \
            --slurpfile adoption src/Broodling/environments/dotnet-r6.adoption.json \
            --slurpfile facts "$RUNNER_TEMP/facts.json" \
            --slurpfile approval src/Broodling/execution-assets/approval.json \
            --slurpfile transitions deployment/native-state-transitions.json \
            --rawfile caddyfile deployment/zeroshot-tls.Caddyfile \
            --arg caddyfileSha256 "$(sha256sum deployment/zeroshot-tls.Caddyfile | cut -d ' ' -f 1)" \
            '$facts[0] as $facts | $approval[0] as $approval | {
              kind: "broodling.image-release/v4",
              sourceRevision: $revision,
              version: (if $version == "" then null else $version end),
              tag: $tag,
              images: {broodling: $broodling, zeroshot: $target, "zeroshot-tls": $facts.zeroshotTlsImage},
              targetEnvironment: $adoption[0],
              application: ($facts | {storeFormat, storeSchemaVersion, storeDefinitionSha256, upgradesFrom}),
              executionAsset: {sha256: $approval.asset.sha256, native: $approval.native, claude: $approval.claude},
              nativeStateTransitions: {to: $target, from: $transitions[0].from},
              zeroshotTls: {user: "10443:10443", caddyfile: {path: "deployment/zeroshot-tls.Caddyfile", sha256: $caddyfileSha256, content: $caddyfile},
                sites: $facts.zeroshotTlsSites},
              demonstration: $facts.readiness
            }' > release-record.json
          cat release-record.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: release-record
          path: release-record.json
          if-no-files-found: error

  release:
    needs: images
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-record
      - name: Attach the release record to the version's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-record.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes 'Image digests, pins and the supported application schema are in release-record.json.'
