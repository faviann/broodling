[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "broodling"
version = "0.1.0"
description = "Broodling V1-P2 admission nucleus: Work Unit identity, source entitlement, immutable Contract revisions and no-effect admission."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Test-only: the product package stays on the standard library. Hypothesis is
# required to run the suite — the property/state-machine tests fail to import
# without it rather than dropping their invariants. pytest-timeout is the
# accidental-hang safety net configured below; the suite still runs under
# `unittest discover`, only without that net.
test = ["hypothesis>=6.100", "pytest-timeout>=2.4"]
# On-demand test-suite review only (issue #34), never installed to run the
# suite and never a quality gate. `[tool.mutmut]` below configures one bounded
# slice; `tests/README.md` records what the campaign found and what it cannot
# express.
mutation = ["mutmut>=3.8"]

[tool.setuptools]
packages = ["broodling"]
include-package-data = false

[tool.setuptools.package-data]
broodling = ["codex_bin/codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Accidental-hang safety net only (issue #32), not a product timing guarantee.
# The timeout applies per setup/call/teardown phase. 1800s clears the longest
# legitimate phase measured on the qualified profile — the #17 assurance-graph
# control fixture at 615s of setup, then a 327s call — with room for a slower
# host, while the rest of the suite finishes in ~105s total with no single test
# over 5s. The signal method raises inside the stuck test, so unittest teardown,
# `finally` cleanup and the traceback of the stuck boundary survive; the thread
# method would os._exit the run and leave the fixtures' children behind.
timeout = 1800
timeout_method = "signal"

# Optional test-suite review tool (issue #34), run by hand, never in CI. The
# defaults are one bounded, seconds-fast slice: identity canonicalization
# against the two modules that claim it. Override `source_paths` and
# `pytest_add_cli_args_test_selection` on the command line for another slice;
# never point them at the provider, containment, crash or qualification tests.
[tool.mutmut]
source_paths = ["broodling/identity.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_work_unit_identity.py",
    "tests/test_work_reference_properties.py",
]
# mutmut runs the suite from a `mutants/` copy holding only `source_paths`, so
# the rest of the package and the root conftest have to be copied beside it.
also_copy = ["conftest.py", "broodling"]
# The default fork-from-main worker inherits a process that has already run the
# suite, which Hypothesis correctly reports as `differing_executors`. Forking
# from a server that never ran a test keeps each worker's Hypothesis state its
# own; the alternative was suppressing a health check that is telling the truth.
process_isolation = "forkserver"
forkserver_warmup = "none"
