[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "broodling"
version = "0.1.0"
description = "One admitted Work Unit, executed by Zeroshot, with durable lifecycle disposition."
requires-python = ">=3.13"
# Official stable Linux wheel; the advertised PyPI distribution is not yet
# published as of 2026-09-16. This is the supported host profile.
dependencies = [
    "the-open-engine-zeroshot @ https://github.com/the-open-engine/zeroshot/releases/download/zeroshot-python-v10.3.0_1/the_open_engine_zeroshot-10.3.0.post1-py3-none-manylinux_2_17_x86_64.whl#sha256=f3629459837a27b7496f98fe0034e7b47a00079d93d3374922c2960952b8ace9",
]

[project.scripts]
broodling = "broodling.cli:main"

[project.optional-dependencies]
# Test-only: Hypothesis is required — the property/state-machine tests fail to import
# without it rather than dropping their invariants. pytest-timeout is the
# accidental-hang safety net configured below; the suite still runs under
# `unittest discover`, only without that net.
test = ["hypothesis>=6.100", "pytest-timeout>=2.4"]
# On-demand test-suite review (issue #34): not needed to run the suite, and not
# a quality gate. `[tool.mutmut]` below configures one bounded default slice.
mutation = ["mutmut>=3.8"]

[tool.setuptools]
packages = ["broodling"]
include-package-data = false

[tool.setuptools.package-data]
broodling = ["codex_bin/codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Accidental-hang safety net, not a product timing guarantee. Signal delivery
# preserves teardown and tracebacks instead of abruptly terminating the runner.
timeout = 180
timeout_method = "signal"

# Optional test-suite review tool (issue #34). Not wired into any test run or
# CI job: it is invoked by hand, and no mutation score is a target. The default
# slice is one seconds-fast campaign — identity canonicalization against the two
# modules that claim it. Native integration and crash tests are not mutated by
# default. Widening it is a
# deliberate edit of the two keys below, not a hidden cost of running the suite.
[tool.mutmut]
source_paths = ["broodling/identity.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_work_unit_identity.py",
    "tests/test_work_reference_properties.py",
]
# mutmut runs the suite from a `mutants/` copy holding only `source_paths`, so
# the rest of the package and the root conftest have to be copied beside it.
also_copy = ["conftest.py", "broodling"]
# The default fork-from-main worker inherits a process that has already run the
# suite, which Hypothesis correctly reports as `differing_executors`. Forking
# from a server that never ran a test keeps each worker's Hypothesis state its
# own; the alternative was suppressing a health check that is telling the truth.
process_isolation = "forkserver"
forkserver_warmup = "none"
